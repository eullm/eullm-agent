[package]
name = "eullm-agent"
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"
description = "EULLM Agent — autonomous ReAct agent with multi-provider LLM support"

[[bin]]
name = "eullm-agent"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Telegram bot
teloxide = { version = "0.12", features = ["macros"] }

# Error handling
anyhow = "1"

# Async trait
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Vendored OpenSSL: compiles from source, no system libssl required.
# Required for cross-compilation to aarch64-unknown-linux-gnu (cross container
# uses Ubuntu Xenial which only provides OpenSSL 1.0.2g, incompatible with
# openssl-sys v0.9.x which requires >=1.1.0).
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
tokio-test = "0.4"
